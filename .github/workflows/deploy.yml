name: CI/CD Pipeline - VG Inventory

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Ejecutar pruebas y verificar cobertura
  # ─────────────────────────────────────────────
  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias del sistema (para better-sqlite3)
        run: sudo apt-get install -y python3 make g++

      - name: Instalar dependencias del proyecto
        run: npm ci --legacy-peer-deps

      - name: Ejecutar pruebas con reporte de cobertura
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Verificar umbral mínimo de cobertura (70%)
        run: |
          COVERAGE=$(npx jest --coverage --coverageReporters=json-summary --silent 2>/dev/null | grep -o '"pct":[0-9.]*' | head -1 | grep -o '[0-9.]*' || echo "0")
          echo "Cobertura detectada: $COVERAGE%"
          node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const lines = summary.total.lines.pct;
            const statements = summary.total.statements.pct;
            console.log('Cobertura de líneas:', lines + '%');
            console.log('Cobertura de statements:', statements + '%');
            if (lines < 70) {
              console.error('ERROR: Cobertura de líneas ' + lines + '% es menor al 70% requerido');
              process.exit(1);
            }
            console.log('OK: Cobertura cumple el umbral mínimo del 70%');
          "
