name: CI/CD Pipeline - VG Inventory

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Ejecutar pruebas y verificar cobertura
  # ─────────────────────────────────────────────
  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias del sistema (para better-sqlite3)
        run: sudo apt-get install -y python3 make g++

      - name: Instalar dependencias del proyecto
        run: npm ci --legacy-peer-deps

      - name: Ejecutar pruebas con reporte de cobertura (mínimo 70%)
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov
        # Jest fallará automáticamente si la cobertura es menor al 70%
        # gracias al coverageThreshold definido en package.json

  # ─────────────────────────────────────────────
  # JOB 2: Construir imagen y subir a Docker Hub
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    needs: test # Este job solo se ejecuta si el job 'test' termina con éxito
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vg-inventory:latest
            ${{ secrets.DOCKER_USERNAME }}/vg-inventory:${{ github.sha }}

  # ─────────────────────────────────────────────
  # JOB 3: Desplegar en servidor AWS EC2
  # ─────────────────────────────────────────────
  deploy-ec2:
    name: Deploy to AWS EC2
    needs: build-and-push # Solo se ejecuta si la imagen se subió con éxito
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar comandos vía SSH en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Descargar la imagen más reciente
            docker pull ${{ secrets.DOCKER_USERNAME }}/vg-inventory:latest
            
            # Detener y eliminar el contenedor viejo si existe
            docker stop vg-inventory || true
            docker rm vg-inventory || true
            
            # Levantar el nuevo contenedor mapeando puertos 8080 y 6061
            docker run -d \
              --name vg-inventory \
              --restart always \
              -p 8080:80 \
              -p 6061:6061 \
              ${{ secrets.DOCKER_USERNAME }}/vg-inventory:latest
